outline_url: "https://outline.yourdomain.com"
outline_token: "outline_api_your_token_here"
check_interval: 3600 # Sync every hour
git_user: "Outline Robot"
git_email: "bot@domain.com"
purge_local_history: true # Keeps the local container storage tiny

sync_tasks:
  - collection_name: "Engineering Docs"
    repo_url: "https://<user>:<pat>@github.com/user/eng-docs.git"
    branch: "main"
  - collection_name: "Personal Wiki"
    repo_url: "https://<user>:<pat>@github.com/user/my-wiki.git"
    branch: "main"